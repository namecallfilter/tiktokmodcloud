name: Test Download Both Mod & Plugin

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: test-download
    cancel-in-progress: false

jobs:
    test-download-both:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Test Download Both
              run: |
                  bun run cli -- both --download

                  MOD_FILE_PATH=$(find ./apks -maxdepth 1 -type f -size +0c -name "*_universal*.apk" -print -quit)
                  if [ -z "${MOD_FILE_PATH}" ]; then
                    echo "No MOD APK file found."
                    exit 1
                  fi

                  PLUGIN_FILE_PATH=$(find ./apks -maxdepth 1 -type f -size +0c -name "*_plugin*.apk" -print -quit)
                  if [ -z "${PLUGIN_FILE_PATH}" ]; then
                    echo "No Plugin APK file found."
                    exit 1
                  fi
