name: Download and Release TikTok Mod & Plugin

on:
    schedule:
        - cron: "0 */1 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: download-and-release
    cancel-in-progress: false

jobs:
    download-and-release:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            matrix:
                type: [mod, plugin]
            fail-fast: false

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Get Latest Info from Source
              id: get_info
              run: |
                  JSON_INFO=$(bun run cli -- ${{ matrix.type }} --check --json)

                  # Validate remote metadata before using it in tags, paths, or outputs.
                  jq -e '
                    (.version | type == "string" and test("^[0-9]+([.][0-9]+)*$")) and
                    (.suffix == null or (.suffix | type == "string" and test("^[A-Za-z0-9._-]+$"))) and
                    (.fileName | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*[.]apk$"))
                  ' <<< "$JSON_INFO" > /dev/null

                  VERSION=$(jq -r .version <<< "$JSON_INFO")
                  SUFFIX=$(jq -r 'if .suffix then "-" + .suffix else "" end' <<< "$JSON_INFO")
                  FILE_NAME=$(jq -r .fileName <<< "$JSON_INFO")

                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "TAG_NAME=v${VERSION}-${{ matrix.type }}${SUFFIX}" >> "$GITHUB_OUTPUT"
                  echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_OUTPUT"

            - name: Check if Release Already Exists
              id: check_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ steps.get_info.outputs.TAG_NAME }}
              run: |
                  echo "Checking for existing release with tag: ${TAG_NAME}"

                  if RESPONSE=$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}"); then
                    echo "Release for ${TAG_NAME} already exists. Halting execution for this job."
                    echo "continue=false" >> "$GITHUB_OUTPUT"
                  else
                    # Authentication, rate limits, and server errors must not look like a missing release.
                    STATUS=$(awk 'NR == 1 {print $2}' <<< "$RESPONSE")
                    if [ "$STATUS" != "404" ]; then
                      echo "Failed to check the existing release (HTTP ${STATUS:-unknown})."
                      exit 1
                    fi
                    echo "No existing release found. Proceeding to download."
                    echo "continue=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download Artifact
              id: download_artifact
              if: steps.check_release.outputs.continue == 'true'
              env:
                  FILE_NAME: ${{ steps.get_info.outputs.FILE_NAME }}
              run: |
                  bun run cli -- ${{ matrix.type }} --download

                  FILE_PATH="./apks/${FILE_NAME}"
                  if [ ! -s "$FILE_PATH" ]; then
                    echo "Script did not download the expected artifact: $FILE_PATH"
                    exit 1
                  fi

                  echo "Artifact downloaded to: ${FILE_PATH}"
                  echo "FILE_PATH=${FILE_PATH}" >> "$GITHUB_OUTPUT"

            - name: Create Release
              if: steps.download_artifact.outputs.FILE_PATH
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.get_info.outputs.TAG_NAME }}
                  target_commitish: ${{ github.sha }}
                  name: TikTok ${{ matrix.type == 'mod' && 'Mod' || 'Plugin' }} v${{ steps.get_info.outputs.VERSION }}
                  files: ${{ steps.download_artifact.outputs.FILE_PATH }}
                  fail_on_unmatched_files: true
                  body: |
                      Automated release for ${{ matrix.type }}

                      Version ${{ steps.get_info.outputs.VERSION }}
